name: Promote Google Play release
run-name: Promote Play ${{ inputs.expected_version }} from run ${{ inputs.internal_run_id }}

on:
  workflow_dispatch:
    inputs:
      internal_run_id:
        description: 'Successful Google Play release run ID containing the tested internal AAB'
        type: string
        required: true
      expected_version:
        description: 'Exact tested version from that run, for example 1.0.20+21 (100% production rollout)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: google-play-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify tested release and approval protections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version_code: ${{ steps.candidate.outputs.version_code }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source workflow provenance and production protections
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INTERNAL_RUN_ID: ${{ inputs.internal_run_id }}
        run: python3 scripts/ci/release_support.py source-run
      - name: Download only the verified source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.internal_run_id }}
          github-token: ${{ github.token }}
          path: release-candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Verify candidate version, source commit and bundle hash
        id: candidate
        env:
          INTERNAL_RUN_ID: ${{ inputs.internal_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: python3 scripts/ci/release_support.py verify-artifact

  production:
    name: Approve exact tested bundle for 100% production
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: google-play-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewer protection and actual approval before authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_support.py approved-gate
      - name: Check production authentication configuration
        env:
          PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: test -n "$PROVIDER" && test -n "$SERVICE_ACCOUNT"
      - name: Authenticate for this app's production track
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Promote existing tested Play version without rebuilding or uploading
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          AAB_SHA256: ${{ needs.preflight.outputs.sha256 }}
        run: python3 scripts/ci/release_support.py promote
