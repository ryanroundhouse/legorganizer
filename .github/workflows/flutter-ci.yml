name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze, test and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: false
          pub-cache: false
      - name: Test release safety checks
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test
        run: flutter test --no-pub
      - name: Test Android version overrides without release credentials
        # Exercise the release override mechanism with a throwaway debug version.
        # This bundle is neither uploaded nor eligible for production promotion.
        run: flutter build appbundle --debug --no-pub --build-name 0.0.0 --build-number 1001
      - name: Ensure dependency lockfile stayed unchanged
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
