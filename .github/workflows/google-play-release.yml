name: Google Play release
run-name: Internal Play ${{ github.event_name }} run ${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_version_name:
        description: 'Confirm the committed version name (for example 1.0.20); build number is automatic'
        type: string
        required: true

permissions:
  contents: read

# One release at a time, including while waiting for a production reviewer.
concurrency:
  group: google-play-release
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify app and main branch; assign stable build number
        id: check
        env:
          EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name }}
        run: python3 scripts/ci/release_support.py preflight

  validate:
    needs: preflight
    uses: ./.github/workflows/flutter-ci.yml
    permissions:
      contents: read

  internal:
    name: Sign and release to internal testing
    needs: [preflight, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: google-play-internal
    permissions:
      contents: read
      id-token: write
    outputs:
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: false
          pub-cache: false
      - name: Check environment configuration
        env:
          PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" && test -n "$SERVICE_ACCOUNT" || {
            echo 'Configure Play Workload Identity Federation in google-play-internal first.' >&2
            exit 1
          }
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Prepare existing upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_UPLOAD_CERTIFICATE_SHA256: ${{ vars.PLAY_UPLOAD_CERTIFICATE_SHA256 }}
        run: python3 scripts/ci/android_signing.py
      - name: Build signed AAB without changing source version or catalog
        env:
          VERSION_NAME: ${{ needs.preflight.outputs.version_name }}
          VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
        run: |
          flutter build appbundle --release --no-pub --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-verification.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/aab-verification.txt"
          git diff --exit-code -- pubspec.yaml pubspec.lock assets
      - name: Record candidate identity
        id: manifest
        env:
          VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
        run: python3 scripts/ci/release_support.py manifest
      - name: Preserve only the signed bundle and public release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-aab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/release.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Authenticate for this app's internal track
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and verify internal release
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          AAB_SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: python3 scripts/ci/release_support.py upload-internal
      - name: Remove runner signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/legorganizer-upload.jks"
